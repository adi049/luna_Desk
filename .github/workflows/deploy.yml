name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: RPC contract (browser bridge vs SQL)
        run: node scripts/check-rpc-contract.mjs

      # Fail here, with a readable message, instead of deploying a bundle that
      # boots to an error screen. The validator checks shape as well as presence:
      # https, no localhost, a key that is anon/publishable and never service_role.
      - name: Environment validation (self-test)
        run: npm run test:env

      - name: Validate the deployment environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_DATA_MODE: live
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run check:env

      - name: Secret scan of the tree
        run: node scripts/scan-secrets.mjs

      - name: Edge Functions check their query errors
        run: npm run check:edge

      # Project pages are served from /<repo>/, user pages and custom domains
      # from /. Override by setting BASE_PATH in this file.
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          # Never `demo` here: production must talk to Supabase.
          VITE_DATA_MODE: live
        run: npm run build

      # SPA fallback for a hash router is not strictly needed, but it keeps 404s
      # from a mistyped deep link landing on GitHub's page.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
