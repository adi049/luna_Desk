name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: RPC contract (browser bridge vs SQL)
        run: node scripts/check-rpc-contract.mjs

      # Fail here, with a readable message, instead of deploying a bundle that
      # boots to an error screen. Keep these two repository secrets configured.
      - name: Require live Supabase configuration
        run: |
          missing=0
          if [ -z "${VITE_SUPABASE_URL:-}" ]; then echo "::error::Repository secret VITE_SUPABASE_URL is not set (Settings → Secrets and variables → Actions)."; missing=1; fi
          if [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then echo "::error::Repository secret VITE_SUPABASE_ANON_KEY is not set (Settings → Secrets and variables → Actions)."; missing=1; fi
          if [ "$missing" = "1" ]; then
            echo "A live deployment needs both values; refusing to publish a broken app."
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Secret scan of the tree
        run: node scripts/scan-secrets.mjs

      # Project pages are served from /<repo>/, user pages and custom domains
      # from /. Override by setting BASE_PATH in this file.
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          # Never `demo` here: production must talk to Supabase.
          VITE_DATA_MODE: live
        run: npm run build

      # SPA fallback for a hash router is not strictly needed, but it keeps 404s
      # from a mistyped deep link landing on GitHub's page.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
