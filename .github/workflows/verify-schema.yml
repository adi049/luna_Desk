name: Verify schema

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/verify-migrations.sh'
      - '.github/workflows/verify-schema.yml'
  pull_request:
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations and run the RLS suite
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          DATABASE: lunadesk_verify
        run: scripts/verify-migrations.sh
