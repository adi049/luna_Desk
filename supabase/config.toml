# Supabase CLI configuration for LunaDesk.
# `supabase link --project-ref <ref>` then `supabase db push` applies the
# migrations in supabase/migrations in order.

project_id = "lunadesk"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "2MiB"

# Branding assets (the agency logo used on receipts). Public read so receipts
# and the portal can render the logo; writes are restricted to admins by
# storage policies (see docs/SETUP.md).
[storage.buckets.branding]
public = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "https://*.github.io/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Client portals never use passwords; admin accounts do.
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.access-code-login]
verify_jwt = false
# The only public function: it must be callable before a session exists.

[functions.admin-clients]
verify_jwt = true

[functions.send-reminders]
verify_jwt = false
# Authenticated by x-cron-secret / service key inside the function, because the
# scheduler is not a signed-in user.

[analytics]
enabled = false
